name: Refresh racing schedule

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/refresh-events.mjs
      - run: |
          git config user.name "GateDrop schedule bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add data/events.json events.json
          git diff --cached --quiet || git commit -m "Refresh racing schedule"
          git push
