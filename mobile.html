<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1016"><title>GateDrop — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d1016;--card:#171b23;--line:#2b3340;--blue:#0875d1;--ice:#81c8ff;--text:#f4f7fb;--muted:#99a4b5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 'DM Sans',sans-serif}.app{max-width:520px;margin:auto;padding:env(safe-area-inset-top) 16px calc(32px + env(safe-area-inset-bottom))}header{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font:900 25px/.9 'Barlow Condensed';text-transform:uppercase;letter-spacing:.03em}.brand i{font-style:normal;color:var(--ice)}.tag,.refresh{font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:var(--ice);border:1px solid #27679d;padding:5px 7px;background:transparent}.refresh{font:700 9px 'DM Sans';cursor:pointer}.eyebrow{margin-top:22px;color:var(--ice);text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:700}h1,h2,p{margin:0}h1{font:800 51px/.88 'Barlow Condensed';text-transform:uppercase;margin:10px 0 20px}.hero{padding:20px;background:linear-gradient(135deg,#123b61,#171b23 61%);border:1px solid #286090;border-radius:8px}.live{font-size:9px;letter-spacing:.1em;font-weight:700;color:var(--ice)}.live:before{content:'●';color:#5eb9ff;margin-right:5px}.hero h2{font:800 40px/.9 'Barlow Condensed';text-transform:uppercase;margin:14px 0 8px}.where{font-size:12px;color:#ced8e5}.count{display:flex;gap:7px;margin:23px 0 17px}.count div{min-width:55px;text-align:center;padding:7px 3px;background:#0d1721;border:1px solid #285171}.count b{display:block;font:700 24px/.9 'Barlow Condensed';color:var(--ice)}.count span{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.watch{display:block;text-align:center;text-decoration:none;background:var(--blue);color:#fff;padding:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}.topline{display:flex;justify-content:space-between;align-items:end;margin:29px 0 13px}.topline h2{font:700 28px/.9 'Barlow Condensed';text-transform:uppercase}.topline small{font-size:9px;color:var(--muted)}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:12px}.filters button{border:1px solid var(--line);background:#151a22;color:#bcc5d2;padding:8px 10px;white-space:nowrap;font:700 10px 'DM Sans'}.filters button.active{background:var(--blue);border-color:var(--blue);color:white}.rows{border-top:1px solid var(--line)}details{border-bottom:1px solid var(--line);background:#11161d}summary{list-style:none;display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;padding:13px 3px;cursor:pointer}summary::-webkit-details-marker{display:none}.date{text-align:center;border-right:1px solid var(--line)}.date b{display:block;font:700 23px/.9 'Barlow Condensed'}.date span{font-size:8px;letter-spacing:.06em;color:var(--muted)}.name{font-size:12px;font-weight:700}.meta{font-size:9px;color:var(--muted);margin-top:3px}.badge{font-size:8px;font-weight:700;padding:4px 5px;color:var(--ice);border:1px solid #275b85}.badge.highlight{color:#ffb1b1;border-color:#793a42}.detail{padding:0 7px 14px 63px;color:#c8d0db;font-size:11px}.detail div{margin-top:7px}.detail a{color:var(--ice)}.actions{display:flex;gap:7px}.actions button{border:1px solid var(--line);background:transparent;color:var(--ice);padding:6px 8px;font:700 9px 'DM Sans';text-transform:uppercase}.status{font-size:10px;color:var(--muted);text-align:center;padding:17px}.status a{display:inline-block;margin-top:10px;color:#fff;background:var(--blue);padding:9px 11px;text-decoration:none;text-transform:uppercase;font-weight:700}.view-switch{margin-top:24px;text-align:center;font-size:10px;color:var(--muted)}.view-switch a{color:var(--ice)}
</style><style>.hero{background-size:cover;background-position:center;position:relative;overflow:hidden}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,13,20,.70),rgba(8,13,20,.28))}.hero>*{position:relative;z-index:1}body.live-now{--bg:#160d10;--card:#211418;--line:#5e3038;--blue:#d7192a;--ice:#ff9ca6;--muted:#d3a2a7}body.live-now .hero{border-color:#dc3948}body.live-now .tag,body.live-now .refresh{border-color:#bc3340;color:#ffafb5}</style><style>
.filters button,.refresh,.watch,.actions button{transition:transform .18s ease,background-color .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease}.filters button:active,.refresh:active,.watch:active,.actions button:active{transform:scale(.97)}.filters button.active{box-shadow:0 5px 16px rgba(22,139,234,.22)}#rows.content-enter details{animation:card-enter .28s cubic-bezier(.2,.8,.2,1) both}#rows.content-enter details:nth-child(2){animation-delay:.025s}#rows.content-enter details:nth-child(3){animation-delay:.05s}#rows.content-enter details:nth-child(4){animation-delay:.075s}details{transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease}details[open]{background:rgba(22,139,234,.055);border-color:rgba(71,163,238,.45);box-shadow:0 8px 20px rgba(0,0,0,.16)}details summary{transition:background-color .2s ease}details[open] summary{background:rgba(22,139,234,.07)}details::details-content{block-size:0;opacity:0;overflow:hidden;transition:block-size .24s ease,opacity .18s ease;transition-behavior:allow-discrete}details[open]::details-content{block-size:auto;opacity:1}.detail{animation:detail-enter .22s ease both}.hero.hero-enter{animation:hero-enter .32s ease both}@keyframes card-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes detail-enter{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}@keyframes hero-enter{from{opacity:.45;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><div class="app"><header><div class="brand">Gate<i>Drop</i></div><button class="refresh" id="refresh">Refresh</button><div class="tag" id="feed">Loading</div></header><main><div class="eyebrow">Mobile race radar</div><h1>Next gate<br>drop.</h1><section class="hero" id="hero"></section><div class="topline"><div><h2>Coming up</h2><small>Times use this device.</small></div></div><div class="filters" id="filters"></div><div class="rows" id="rows"></div></main></div><script src="app-data.js"></script><script>
let events=[],active='All',updatedAt=null;const series=['All','Favorites','Hard Enduro','EnduroCross','AMA Supercross','Pro Motocross','SMX Playoffs'];const key='gatedrop.';const getSet=name=>new Set(JSON.parse(localStorage.getItem(key+name)||'[]'));let favorites=getSet('favorites'),hidden=getSet('hidden');const save=(name,set)=>localStorage.setItem(key+name,JSON.stringify([...set]));const esc=value=>String(value||'Venue to be confirmed').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
function visible(){return events.filter(event=>!hidden.has(event.id))}function label(event){return GateDrop.isLive(event)?'LIVE NOW':event.status==='video'?'VIDEO':'SCHEDULED'}function render(){const available=visible(),shown=available.filter(event=>active==='All'||active==='Favorites'?active!=='Favorites'||favorites.has(event.id):event.series===active);const schedule=active!=='All'&&active!=='Favorites'?`<div class="status"><a href="${GateDrop.scheduleUrl(active)}">View official schedule</a></div>`:'';document.getElementById('filters').innerHTML=series.map(item=>`<button class="${item===active?'active':''}" data-series="${item}">${item==='AMA Supercross'?'Supercross':item==='Favorites'?'★ Favorites':item}</button>`).join('');const rows=document.getElementById('rows');rows.classList.remove('content-enter');void rows.offsetWidth;rows.classList.add('content-enter');rows.innerHTML=shown.length?shown.map(event=>`<details><summary><div class="date"><b>${new Date(event.firstGate).getDate()}</b><span>${new Intl.DateTimeFormat(undefined,{month:'short'}).format(new Date(event.firstGate)).toUpperCase()}</span></div><div><div class="name">${esc(event.name)}</div><div class="meta">${esc(event.series)} · ${GateDrop.time(event.firstGate)}</div></div><span class="badge ${GateDrop.isLive(event)?'':'highlight'}">${label(event)}</span></summary><div class="detail"><div>${esc(event.where)}</div><div>${esc(event.round)}</div><div><a href="${event.watchUrl}">${esc(event.provider)} ↗</a> · <a href="${event.highlightsUrl}">YouTube ↗</a></div><div class="actions"><button data-action="favorite" data-id="${event.id}">${favorites.has(event.id)?'★ Saved':'☆ Favorite'}</button><button data-action="hide" data-id="${event.id}">Hide</button></div></div></details>`).join('')+schedule:`<div class="status">No upcoming events in ${active==='All'||active==='Favorites'?'this view':esc(active)}.<br>${active!=='All'&&active!=='Favorites'?`<a href="${GateDrop.scheduleUrl(active)}">Open official schedule</a>`:''}</div>`;document.querySelectorAll('[data-series]').forEach(button=>button.onclick=()=>{active=button.dataset.series;render()});document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>{const set=button.dataset.action==='favorite'?favorites:hidden;if(set.has(button.dataset.id))set.delete(button.dataset.id);else set.add(button.dataset.id);save(button.dataset.action==='favorite'?'favorites':'hidden',set);render();updateHero()})}
function hero(event){const box=document.getElementById('hero');box.classList.remove('hero-enter');void box.offsetWidth;box.classList.add('hero-enter');if(!event){box.textContent='No upcoming events';return}box.style.backgroundImage=event.imageUrl?`linear-gradient(90deg,rgba(8,13,20,.70),rgba(8,13,20,.28)),url("${event.imageUrl}")`:'';const count=GateDrop.countdown(event.firstGate);box.innerHTML=`<div class="live">${GateDrop.isLive(event)?'LIVE NOW':'NEXT EVENT'}</div><h2>${esc(event.name).replace(' — ','<br>')}</h2><div class="where">${esc(event.where)} · ${GateDrop.day(event.firstGate)}</div><div class="count"><div><b>${String(count.days).padStart(2,'0')}</b><span>Days</span></div><div><b>${String(count.hours).padStart(2,'0')}</b><span>Hours</span></div><div><b>${String(count.minutes).padStart(2,'0')}</b><span>Minutes</span></div></div><a class="watch" href="${event.watchUrl}">Where to watch</a>`}function updateHero(){hero(visible()[0])}function freshness(){if(!updatedAt)return 'Saved schedule';const minutes=Math.max(0,Math.round((Date.now()-new Date(updatedAt))/60000));return minutes<2?'Updated now':`Updated ${minutes}m ago`}function reflectLiveState(){const live=GateDrop.liveNow(visible());document.body.classList.toggle('live-now',live);document.getElementById('feed').textContent=live?'● Live now':freshness()}async function refresh(){document.getElementById('refresh').textContent='Checking';const feed=await GateDrop.load();events=feed.events;updatedAt=feed.updatedAt;updateHero();render();reflectLiveState();document.getElementById('refresh').textContent='Refresh'}document.getElementById('refresh').onclick=refresh;refresh();setInterval(()=>{updateHero();reflectLiveState()},60000);
</script></body></html>
