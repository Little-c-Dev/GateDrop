<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1016"><title>GateDrop — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0d1016;--card:#171b23;--line:#2b3340;--blue:#0875d1;--ice:#81c8ff;--text:#f4f7fb;--muted:#99a4b5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 'DM Sans',sans-serif}.app{max-width:520px;margin:auto;padding:env(safe-area-inset-top) 16px calc(32px + env(safe-area-inset-bottom))}header{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font:900 25px/.9 'Barlow Condensed';text-transform:uppercase;letter-spacing:.03em}.brand i{font-style:normal;color:var(--ice)}.tag{font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:var(--ice);border:1px solid #27679d;padding:5px 7px}.eyebrow{margin-top:22px;color:var(--ice);text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:700}h1,h2,p{margin:0}h1{font:800 51px/.88 'Barlow Condensed';text-transform:uppercase;margin:10px 0 20px}.hero{padding:20px;background:linear-gradient(135deg,#123b61,#171b23 61%);border:1px solid #286090;border-radius:8px}.live{font-size:9px;letter-spacing:.1em;font-weight:700;color:var(--ice)}.live:before{content:'●';color:#5eb9ff;margin-right:5px}.hero h2{font:800 40px/.9 'Barlow Condensed';text-transform:uppercase;margin:14px 0 8px}.where{font-size:12px;color:#ced8e5}.count{display:flex;gap:7px;margin:23px 0 17px}.count div{min-width:55px;text-align:center;padding:7px 3px;background:#0d1721;border:1px solid #285171}.count b{display:block;font:700 24px/.9 'Barlow Condensed';color:var(--ice)}.count span{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.watch{display:block;text-align:center;text-decoration:none;background:var(--blue);color:#fff;padding:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}.topline{display:flex;justify-content:space-between;align-items:end;margin:29px 0 13px}.topline h2{font:700 28px/.9 'Barlow Condensed';text-transform:uppercase}.topline small{font-size:9px;color:var(--muted)}.filters{display:flex;gap:7px;overflow:auto;padding-bottom:12px}.filters button{border:1px solid var(--line);background:#151a22;color:#bcc5d2;padding:8px 10px;white-space:nowrap;font:700 10px 'DM Sans'}.filters button.active{background:var(--blue);border-color:var(--blue);color:white}.rows{border-top:1px solid var(--line)}details{border-bottom:1px solid var(--line);background:#11161d}summary{list-style:none;display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;padding:13px 3px;cursor:pointer}summary::-webkit-details-marker{display:none}.date{text-align:center;border-right:1px solid var(--line)}.date b{display:block;font:700 23px/.9 'Barlow Condensed'}.date span{font-size:8px;letter-spacing:.06em;color:var(--muted)}.name{font-size:12px;font-weight:700}.meta{font-size:9px;color:var(--muted);margin-top:3px}.badge{font-size:8px;font-weight:700;padding:4px 5px;color:var(--ice);border:1px solid #275b85}.badge.highlight{color:#ffb1b1;border-color:#793a42}.detail{padding:0 7px 14px 63px;color:#c8d0db;font-size:11px}.detail div{margin-top:7px}.detail a{color:var(--ice)}.status{font-size:10px;color:var(--muted);text-align:center;padding:17px}.view-switch{margin-top:24px;text-align:center;font-size:10px;color:var(--muted)}.view-switch a{color:var(--ice)}
</style><style>.hero{background-size:cover;background-position:center;position:relative;overflow:hidden}.hero:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,13,20,.93),rgba(8,13,20,.58))}.hero>*{position:relative;z-index:1}body.live-now{--bg:#160d10;--card:#211418;--line:#5e3038;--blue:#d7192a;--ice:#ff9ca6;--muted:#d3a2a7}body.live-now .hero{border-color:#dc3948}body.live-now .tag{border-color:#bc3340;color:#ffafb5}</style></head><body><div class="app"><header><div class="brand">Gate<i>Drop</i></div><div class="tag" id="feed">Loading</div></header><main><div class="eyebrow">Mobile race radar</div><h1>Next gate<br>drop.</h1><section class="hero" id="hero"></section><div class="topline"><div><h2>Coming up</h2><small>Times use this device.</small></div></div><div class="filters" id="filters"></div><div class="rows" id="rows"></div></main><div class="view-switch">Viewing mobile layout · <a href="desktop.html">Open desktop layout</a></div></div><script src="app-data.js"></script><script>
let events=[],active='All';const series=['All','Hard Enduro','EnduroCross','AMA Supercross','Pro Motocross','SMX Playoffs'];
function render(){const shown=events.filter(e=>active==='All'||e.series===active);document.getElementById('filters').innerHTML=series.map(s=>`<button class="${s===active?'active':''}" data-series="${s}">${s==='AMA Supercross'?'Supercross':s}</button>`).join('');document.getElementById('rows').innerHTML=shown.length?shown.map(e=>`<details><summary><div class="date"><b>${new Date(e.firstGate).getDate()}</b><span>${new Intl.DateTimeFormat(undefined,{month:'short'}).format(new Date(e.firstGate)).toUpperCase()}</span></div><div><div class="name">${e.name}</div><div class="meta">${e.series} · ${GateDrop.time(e.firstGate)}</div></div><span class="badge ${e.status==='live'?'':'highlight'}">${e.status==='live'?'LIVE':'VIDEO'}</span></summary><div class="detail"><div>${e.where}</div><div>${e.round}</div><div><a href="${e.watchUrl}" target="_blank" rel="noopener">${e.provider} ↗</a> · <a href="${e.highlightsUrl}" target="_blank" rel="noopener">YouTube ↗</a></div></div></details>`).join(''):'<div class="status">No upcoming events in this series.</div>';document.querySelectorAll('[data-series]').forEach(button=>button.onclick=()=>{active=button.dataset.series;render()})}
function hero(event){const box=document.getElementById('hero');if(!event){box.textContent='No upcoming events';return}box.style.backgroundImage=event.imageUrl?`linear-gradient(90deg,rgba(8,13,20,.93),rgba(8,13,20,.58)),url("${event.imageUrl}")`:'';const count=GateDrop.countdown(event.firstGate);box.innerHTML=`<div class="live">${event.status==='live'?'LIVESTREAM':'HIGHLIGHTS'}</div><h2>${event.name.replace(' — ','<br>')}</h2><div class="where">${event.where} · ${GateDrop.day(event.firstGate)}</div><div class="count"><div><b>${String(count.days).padStart(2,'0')}</b><span>Days</span></div><div><b>${String(count.hours).padStart(2,'0')}</b><span>Hours</span></div><div><b>${String(count.minutes).padStart(2,'0')}</b><span>Minutes</span></div></div><a class="watch" target="_blank" rel="noopener" href="${event.watchUrl}">Where to watch</a>`}
let feedLabel='Loading';function reflectLiveState(){const active=GateDrop.liveNow(events);document.body.classList.toggle('live-now',active);document.getElementById('feed').textContent=active?'● Live now':feedLabel}GateDrop.load().then(feed=>{events=feed.events;feedLabel=feed.remote?'Live feed':'Preview data';hero(events[0]);render();reflectLiveState();setInterval(()=>{hero(events[0]);reflectLiveState()},60000)});
</script></body></html>
